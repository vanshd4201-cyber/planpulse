  <style>
/* VisionOS Luxe Glass UI System - Luminous Aurora & Refractive Glassmorphism */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap');

:root {
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-display: 'Outfit', system-ui, sans-serif;
  --glass-blur: 28px;
  --liquid-opacity: 0.42;
}

body {
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-color: #090d16;
  color: #f8fafc;
  min-height: 100vh;
  overflow-x: hidden;
}

h1, h2, h3, h4, .font-display {
  font-family: var(--font-display);
}

/* ========================================================= */
/* 1. Luminous VisionOS Aurora Meshes & Ambient Lighting     */
/* ========================================================= */

.liquid-bg, .crystal-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
  background: 
    radial-gradient(circle at 50% 0%, rgba(30, 27, 75, 0.6) 0%, transparent 60%),
    radial-gradient(circle at 10% 75%, rgba(15, 23, 42, 0.7) 0%, transparent 50%),
    radial-gradient(circle at 90% 85%, rgba(19, 29, 53, 0.6) 0%, transparent 50%),
    #090d16;
}

.liquid-orb {
  position: absolute;
  border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
  filter: blur(120px);
  will-change: transform, border-radius;
  pointer-events: none;
  opacity: var(--liquid-opacity, 0.42);
}

/* 1. Radiant Electric Violet & Lilac Orb */
.orb-1 {
  width: 820px;
  height: 820px;
  top: -15%;
  left: 12%;
  background: radial-gradient(circle, rgba(168, 85, 247, 0.55) 0%, rgba(139, 92, 246, 0.38) 45%, rgba(99, 102, 241, 0.18) 75%, transparent 100%);
  animation: liquid-drift-1 22s ease-in-out infinite alternate, liquid-morph 14s ease-in-out infinite alternate;
}

/* 2. Neon Cyan & Azure Sapphire Orb */
.orb-2 {
  width: 880px;
  height: 880px;
  bottom: -20%;
  right: -5%;
  background: radial-gradient(circle, rgba(6, 182, 212, 0.5) 0%, rgba(56, 189, 248, 0.38) 45%, rgba(59, 130, 246, 0.2) 75%, transparent 100%);
  animation: liquid-drift-2 26s ease-in-out infinite alternate, liquid-morph 18s ease-in-out infinite alternate-reverse;
}

/* 3. Vivid Hot Magenta & Sunset Rose Orb */
.orb-3 {
  width: 720px;
  height: 720px;
  top: 28%;
  right: 18%;
  background: radial-gradient(circle, rgba(236, 72, 153, 0.45) 0%, rgba(217, 70, 239, 0.32) 50%, rgba(244, 63, 94, 0.15) 75%, transparent 100%);
  animation: liquid-drift-3 20s ease-in-out infinite alternate, liquid-morph 16s ease-in-out infinite alternate;
}

/* 4. Lagoon Emerald & Radiant Seafoam Orb */
.orb-4 {
  width: 750px;
  height: 750px;
  bottom: 8%;
  left: -12%;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.4) 0%, rgba(20, 184, 166, 0.28) 50%, rgba(6, 182, 212, 0.14) 75%, transparent 100%);
  animation: liquid-drift-4 28s ease-in-out infinite alternate, liquid-morph 20s ease-in-out infinite alternate-reverse;
}

/* 5. Center Solar Golden Amber Glow */
.orb-5 {
  width: 620px;
  height: 620px;
  top: 10%;
  left: 42%;
  background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(251, 146, 60, 0.2) 50%, transparent 80%);
  animation: liquid-drift-1 32s ease-in-out infinite alternate-reverse, liquid-morph 24s ease-in-out infinite alternate;
}

/* Fluid Caustic Texture Overlay */
.liquid-caustics {
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 45% 10%, rgba(255, 255, 255, 0.05) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(255, 255, 255, 0.04) 0%, transparent 55%);
  pointer-events: none;
}

/* ========================================================= */
/* 2. VisionOS Luxe Glass Panels                             */
/* ========================================================= */

.glass-panel {
  background: rgba(255, 255, 255, 0.065) !important;
  backdrop-filter: blur(var(--glass-blur, 28px)) saturate(210%) contrast(108%) !important;
  -webkit-backdrop-filter: blur(var(--glass-blur, 28px)) saturate(210%) contrast(108%) !important;
  border: 1px solid rgba(255, 255, 255, 0.2) !important;
  box-shadow: 
    0 20px 50px -10px rgba(0, 0, 0, 0.6), 
    0 0 24px rgba(168, 85, 247, 0.08),
    inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.48),
    inset 0 -1px 2px 0 rgba(0, 0, 0, 0.3) !important;
  position: relative;
  overflow: hidden;
}

/* Specular Prismatic Top Rim Highlight */
.glass-panel::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(
    90deg, 
    transparent 0%, 
    rgba(236, 72, 153, 0.65) 15%, 
    rgba(255, 255, 255, 0.95) 50%, 
    rgba(56, 189, 248, 0.65) 85%, 
    transparent 100%
  );
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
  pointer-events: none;
  z-index: 1;
}

/* Subtle Diagonal Liquid Sheen Reflection */
.glass-panel::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.015) 35%, transparent 65%);
  pointer-events: none;
}

/* ========================================================= */
/* 3. Fluid Elevation & Hover Animations                     */
/* ========================================================= */

.glass-panel-hover {
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

.glass-panel-hover:hover {
  background: rgba(255, 255, 255, 0.1) !important;
  border-color: rgba(255, 255, 255, 0.42) !important;
  transform: translateY(-5px) scale(1.008);
  box-shadow: 
    0 30px 70px -12px rgba(0, 0, 0, 0.75), 
    0 0 36px rgba(168, 85, 247, 0.28),
    0 0 20px rgba(56, 189, 248, 0.2),
    inset 0 2px 3px 0 rgba(255, 255, 255, 0.75),
    inset 0 -1.5px 2px 0 rgba(255, 255, 255, 0.15) !important;
}

/* ========================================================= */
/* 4. Illuminated Icon Badges & Accents                      */
/* ========================================================= */

.badge-violet {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(139, 92, 246, 0.18) 100%) !important;
  border: 1px solid rgba(168, 85, 247, 0.45) !important;
  box-shadow: 0 0 16px rgba(168, 85, 247, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.5) !important;
  color: #e9d5ff !important;
}

.badge-cyan {
  background: linear-gradient(135deg, rgba(6, 182, 212, 0.3) 0%, rgba(59, 130, 246, 0.18) 100%) !important;
  border: 1px solid rgba(6, 182, 212, 0.45) !important;
  box-shadow: 0 0 16px rgba(6, 182, 212, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.5) !important;
  color: #a5f3fc !important;
}

.badge-pink {
  background: linear-gradient(135deg, rgba(236, 72, 153, 0.3) 0%, rgba(217, 70, 239, 0.18) 100%) !important;
  border: 1px solid rgba(236, 72, 153, 0.45) !important;
  box-shadow: 0 0 16px rgba(236, 72, 153, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.5) !important;
  color: #fbcfe8 !important;
}

.badge-amber {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.3) 0%, rgba(249, 115, 22, 0.18) 100%) !important;
  border: 1px solid rgba(245, 158, 11, 0.45) !important;
  box-shadow: 0 0 16px rgba(245, 158, 11, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.5) !important;
  color: #fde68a !important;
}

.badge-emerald {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.3) 0%, rgba(20, 184, 166, 0.18) 100%) !important;
  border: 1px solid rgba(16, 185, 129, 0.45) !important;
  box-shadow: 0 0 16px rgba(16, 185, 129, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.5) !important;
  color: #a7f3d0 !important;
}

/* ========================================================= */
/* 5. Navigation & VisionOS Modals                           */
/* ========================================================= */

.glass-nav {
  background: rgba(9, 13, 22, 0.65) !important;
  backdrop-filter: blur(calc(var(--glass-blur, 28px) + 8px)) saturate(220%) !important;
  -webkit-backdrop-filter: blur(calc(var(--glass-blur, 28px) + 8px)) saturate(220%) !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.18) !important;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 20px rgba(168, 85, 247, 0.1) !important;
  position: relative;
}

.glass-nav::before {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(168, 85, 247, 0.4) 30%, rgba(56, 189, 248, 0.4) 70%, transparent 100%);
  pointer-events: none;
}

.glass-modal {
  background: rgba(11, 16, 29, 0.82) !important;
  backdrop-filter: blur(calc(var(--glass-blur, 28px) + 16px)) saturate(220%) contrast(110%) !important;
  -webkit-backdrop-filter: blur(calc(var(--glass-blur, 28px) + 16px)) saturate(220%) contrast(110%) !important;
  border: 1px solid rgba(255, 255, 255, 0.28) !important;
  box-shadow: 
    0 40px 100px -20px rgba(0, 0, 0, 0.95), 
    0 0 50px rgba(168, 85, 247, 0.2),
    inset 0 2px 3px 0 rgba(255, 255, 255, 0.55),
    inset 0 -1px 2px 0 rgba(255, 255, 255, 0.15) !important;
  position: relative;
}

.glass-modal::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, rgba(236, 72, 153, 0.7) 25%, rgba(255, 255, 255, 0.95) 50%, rgba(56, 189, 248, 0.7) 75%, transparent 100%);
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
  pointer-events: none;
}

/* ========================================================= */
/* 6. Inputs & Controls                                      */
/* ========================================================= */

.glass-input {
  background: rgba(255, 255, 255, 0.07) !important;
  backdrop-filter: blur(20px) !important;
  -webkit-backdrop-filter: blur(20px) !important;
  border: 1px solid rgba(255, 255, 255, 0.18) !important;
  box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.4) !important;
  color: #fff !important;
  transition: all 0.2s ease;
}

.glass-input:focus {
  background: rgba(255, 255, 255, 0.12) !important;
  border-color: rgba(192, 132, 252, 0.7) !important;
  box-shadow: 
    0 0 0 3px rgba(168, 85, 247, 0.3), 
    0 0 16px rgba(168, 85, 247, 0.25),
    inset 0 2px 4px 0 rgba(0, 0, 0, 0.3) !important;
}

/* ========================================================= */
/* 7. Buttons & Pills                                        */
/* ========================================================= */

.glass-pill {
  background: rgba(255, 255, 255, 0.08) !important;
  backdrop-filter: blur(20px) saturate(200%) !important;
  -webkit-backdrop-filter: blur(20px) saturate(200%) !important;
  border: 1px solid rgba(255, 255, 255, 0.2) !important;
  box-shadow: 
    0 4px 16px rgba(0, 0, 0, 0.25), 
    inset 0 1px 1.5px rgba(255, 255, 255, 0.45) !important;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

.glass-pill:hover {
  background: rgba(255, 255, 255, 0.15) !important;
  border-color: rgba(255, 255, 255, 0.42) !important;
  box-shadow: 
    0 6px 22px rgba(0, 0, 0, 0.35), 
    0 0 20px rgba(168, 85, 247, 0.25),
    inset 0 1px 2px rgba(255, 255, 255, 0.7) !important;
  transform: translateY(-1.5px);
}

.glass-btn-primary {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.85) 0%, rgba(139, 92, 246, 0.9) 45%, rgba(6, 182, 212, 0.85) 100%) !important;
  backdrop-filter: blur(24px) !important;
  -webkit-backdrop-filter: blur(24px) !important;
  border: 1px solid rgba(255, 255, 255, 0.45) !important;
  box-shadow: 
    0 8px 25px rgba(139, 92, 246, 0.5), 
    0 0 20px rgba(168, 85, 247, 0.3),
    inset 0 1.5px 2px rgba(255, 255, 255, 0.8), 
    inset 0 -1.5px 2px rgba(0, 0, 0, 0.35) !important;
  color: #ffffff !important;
  font-weight: 800 !important;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

.glass-btn-primary:hover {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.95) 0%, rgba(139, 92, 246, 1) 45%, rgba(6, 182, 212, 0.95) 100%) !important;
  border-color: rgba(255, 255, 255, 0.65) !important;
  box-shadow: 
    0 12px 36px rgba(168, 85, 247, 0.7), 
    0 0 30px rgba(6, 182, 212, 0.4), 
    inset 0 2px 3px rgba(255, 255, 255, 0.95) !important;
  transform: translateY(-2px) scale(1.02);
}

.glass-btn-primary:active {
  transform: translateY(0) scale(0.98);
}

/* ========================================================= */
/* 8. Typography Gradients & Animations                      */
/* ========================================================= */

.text-gradient {
  background: linear-gradient(135deg, #ffffff 0%, #f8fafc 40%, #e0e7ff 75%, #c7d2fe 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 10px rgba(168, 85, 247, 0.25));
}

/* Liquid Blob Morphing Animation */
@keyframes liquid-morph {
  0% {
    border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
    transform: scale(1) rotate(0deg);
  }
  33% {
    border-radius: 70% 30% 46% 54% / 30% 29% 71% 70%;
    transform: scale(1.06) rotate(120deg);
  }
  66% {
    border-radius: 30% 70% 70% 30% / 50% 60% 40% 50%;
    transform: scale(0.95) rotate(240deg);
  }
  100% {
    border-radius: 58% 42% 38% 62% / 42% 65% 35% 58%;
    transform: scale(1.03) rotate(360deg);
  }
}

/* Liquid Gentle Floating Drift Animations */
@keyframes liquid-drift-1 {
  0% { transform: translate(0, 0); }
  50% { transform: translate(80px, 90px); }
  100% { transform: translate(-60px, 140px); }
}

@keyframes liquid-drift-2 {
  0% { transform: translate(0, 0); }
  50% { transform: translate(-100px, -80px); }
  100% { transform: translate(70px, -120px); }
}

@keyframes liquid-drift-3 {
  0% { transform: translate(0, 0); }
  50% { transform: translate(90px, -70px); }
  100% { transform: translate(-80px, 80px); }
}

@keyframes liquid-drift-4 {
  0% { transform: translate(0, 0); }
  50% { transform: translate(-70px, 90px); }
  100% { transform: translate(100px, -60px); }
}

/* Translucent Liquid Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.25);
  border-radius: 9999px;
  backdrop-filter: blur(12px);
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.45);
}

/* Smooth Rotation */
@keyframes spin-slow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.animate-spin-slow {
  animation: spin-slow 8s linear infinite;
}

/* ========================================================= */
/* 9. Print Media Styles for Coordinator & Catering Packets  */
/* ========================================================= */

@media print {
  body {
    background-color: #ffffff !important;
    color: #0f172a !important;
  }
  .liquid-bg, .crystal-bg, header, nav, footer, .glass-nav {
    display: none !important;
  }
  .glass-modal, .glass-panel {
    background: #ffffff !important;
    color: #0f172a !important;
    border: 1px solid #cbd5e1 !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
  textarea {
    color: #000000 !important;
    background: #ffffff !important;
    border: none !important;
    font-size: 11pt !important;
    height: auto !important;
    max-height: none !important;
  }
}

</style>

// LocalStorage and Data Management Service

const STORAGE_KEYS = {
  EVENTS: "planpulse_events_data_v1",
  ACTIVE_ID: "planpulse_active_event_id_v1",
  GEMINI_KEY: "planpulse_gemini_api_key_v1",
  GEMINI_MODEL: "planpulse_gemini_model_v1",
  DARK_MODE: "planpulse_dark_mode_v1"
};

window.StorageService = {
  getEvents() {
    try {
      const stored = localStorage.getItem(STORAGE_KEYS.EVENTS);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed) && parsed.length > 0) {
          const defaults = window.DEFAULT_EVENTS || [];
          return parsed.map(ev => {
            const defaultMatch = defaults.find(d => d.id === ev.id);
            return {
              ...ev,
              tables: Array.isArray(ev.tables) && ev.tables.length > 0 ? ev.tables : (defaultMatch?.tables || ev.tables || []),
              guests: Array.isArray(ev.guests) && ev.guests.length > 0 ? ev.guests : (defaultMatch?.guests || ev.guests || [])
            };
          });
        }
      }
    } catch (e) {
      console.warn("Error reading events from localStorage, falling back to defaults", e);
    }
    // Seed defaults
    const defaults = window.DEFAULT_EVENTS || [];
    this.saveEvents(defaults);
    return defaults;
  },

  saveEvents(events) {
    try {
      localStorage.setItem(STORAGE_KEYS.EVENTS, JSON.stringify(events));
    } catch (e) {
      console.error("Failed to save events to localStorage", e);
    }
  },

  getActiveEventId() {
    const stored = localStorage.getItem(STORAGE_KEYS.ACTIVE_ID);
    if (stored) return stored;
    const events = this.getEvents();
    return events.length > 0 ? events[0].id : "";
  },

  setActiveEventId(id) {
    localStorage.setItem(STORAGE_KEYS.ACTIVE_ID, id);
  },

  getApiKey() {
    return localStorage.getItem(STORAGE_KEYS.GEMINI_KEY) || "";
  },

  setApiKey(key) {
    if (key) {
      localStorage.setItem(STORAGE_KEYS.GEMINI_KEY, key.trim());
    } else {
      localStorage.removeItem(STORAGE_KEYS.GEMINI_KEY);
    }
  },

  getModel() {
    return localStorage.getItem(STORAGE_KEYS.GEMINI_MODEL) || "gemini-2.0-flash";
  },

  setModel(model) {
    localStorage.setItem(STORAGE_KEYS.GEMINI_MODEL, model);
  },

  getDarkMode() {
    const val = localStorage.getItem(STORAGE_KEYS.DARK_MODE);
    return val !== null ? JSON.parse(val) : true; // Default dark glassmorphic mode
  },

  setDarkMode(isDark) {
    localStorage.setItem(STORAGE_KEYS.DARK_MODE, JSON.stringify(isDark));
  },

  exportJSON() {
    const data = {
      version: "1.0",
      exportedAt: new Date().toISOString(),
      events: this.getEvents()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `planpulse-events-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },

  importJSON(jsonString) {
    try {
      const data = JSON.parse(jsonString);
      if (data && Array.isArray(data.events)) {
        this.saveEvents(data.events);
        if (data.events[0]) {
          this.setActiveEventId(data.events[0].id);
        }
        return true;
      }
    } catch (e) {
      console.error("Failed to parse import JSON", e);
    }
    return false;
  },

  resetToDefaults() {
    localStorage.removeItem(STORAGE_KEYS.EVENTS);
    return this.getEvents();
  }
};

// Hybrid GenAI Service: Live Google Gemini API with smart offline fallback

window.GeminiService = {
  async callGemini(systemPrompt, userPrompt) {
    const apiKey = window.StorageService.getApiKey();
    const model = window.StorageService.getModel() || "gemini-2.0-flash";

    if (!apiKey) {
      console.log("No Gemini API key provided; using built-in high fidelity offline AI simulator.");
      return null;
    }

    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

    const body = {
      contents: [
        {
          role: "user",
          parts: [
            { text: `${systemPrompt}\n\nIMPORTANT: Return ONLY valid, raw JSON (no markdown formatting, no code fences \`\`\`json) adhering to the requested schema.\n\nUser Request: ${userPrompt}` }
          ]
        }
      ],
      generationConfig: {
        temperature: 0.7,
        maxOutputTokens: 2500,
        responseMimeType: "application/json"
      }
    };

    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error?.message || `API error status: ${response.status}`);
      }

      const data = await response.json();
      const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawText) throw new Error("Empty response received from Gemini.");

      // Clean up in case fenced markdown is returned
      const cleanJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
      return JSON.parse(cleanJson);

  // 2. AI Budget Advisor
  async getBudgetAdvice(event) {
    const totalEst = event.budgetItems.reduce((acc, i) => acc + (Number(i.estimated) || 0), 0);
    const totalAct = event.budgetItems.reduce((acc, i) => acc + (Number(i.actual) || 0), 0);
    const diff = event.targetBudget - totalAct;

    const systemPrompt = `You are a savvy event financial strategist. Provide actionable, high-impact budget insights in JSON format.
Schema:
{
  "summary": "Overall budget health assessment",
  "costSavingTips": ["Tip 1 with estimated savings", "Tip 2", "Tip 3"],
  "hiddenFeesWarning": ["Hidden fee 1", "Hidden fee 2"],
  "negotiationTip": "Specific negotiation tactic for vendors"
}`;

    const userPrompt = `Event: ${event.name} (${event.type}), Target Budget: ${event.currency}${event.targetBudget}, Total Estimated: ${event.currency}${totalEst}, Total Actual so far: ${event.currency}${totalAct}, Guests: ${event.guestCount}. Existing items: ${event.budgetItems.map(b => `${b.category}: ${event.currency}${b.estimated}`).join(", ")}`;

    try {
      const res = await this.callGemini(systemPrompt, userPrompt);
      if (res && res.summary) return res;
    } catch (e) {
      // Fallback
    }

    return {
      summary: diff >= 0 
        ? `Your budget is in strong shape! You currently have ${event.currency}${diff.toLocaleString()} buffer remaining under your ${event.currency}${event.targetBudget.toLocaleString()} ceiling.`
        : `Caution: You are currently projected ${event.currency}${Math.abs(diff).toLocaleString()} over your target ceiling. Immediate adjustments are recommended.`,
      costSavingTips: [
        `Bundle sound, lighting, and DJ with one production vendor to negotiate a 10-15% package discount.`,
        `Switch from a formal multi-course plated dinner to curated artisan food stations or heavy cocktail tapas to trim catering costs by up to 20%.`,
        `Choose in-season local foliage and dramatic candle groupings over out-of-season imported flowers to save $400-$800 on decor.`
      ],
      hiddenFeesWarning: [
        `Look out for vendor service charges (often 20-24%), cake cutting fees ($2-$5/slice), and corkage fees ($15-$30/bottle).`,
        `Account for required overtime load-out rates if the venue requires tear-down completed before midnight.`
      ],
      negotiationTip: `Offer to pay the remaining balance via electronic bank transfer (ACH/wire) rather than credit card to ask the vendor to pass along their 3% merchant processing savings to you.`
    };
  },

        }
      ],

        bodyText: `Join us for an unforgettable celebration of laughter, connection, and great memories. We've curated delicious bites, vibrant music, and a night designed just for our favorite people.`,
        callToAction: "Please RSVP by the deadline so we can save your glass and seat at the table!"

  // 5. GenAI Smart Seating & Table Strategist
  async generateSeatingArrangement(event, tables = [], guests = []) {
    const attendingGuests = (guests || []).filter(g => g.status === "Attending");
    if (tables.length === 0 || attendingGuests.length === 0) {
      return {
        assignments: {},
        rationale: ["Add at least one table and attending guests to generate an AI seating chart."],
        cateringNotes: [],
        vibeTips: ["Keep family near the center and place energetic friend groups near the dance floor."]
      };
    }

    const systemPrompt = `You are PlanPulse AI Seating Strategist. Given an event, available tables with capacities, and a list of attending guests with group affinities, plus-ones, and dietary restrictions, return a balanced seating arrangement JSON.
Schema:
{
  "assignments": {
    "guestId1": "tableIdA",
    "guestId2": "tableIdB"
  },
  "rationale": [
    "Table 1: Description of who was grouped here and why",
    "Table 2: Description of group dynamics and comfort"
  ],
  "cateringNotes": [
    "Specific dietary warning for table X (e.g., severe allergy flags for kitchen)"
  ],
  "vibeTips": [
    "Host tip regarding acoustics, flow, or speeches"
  ]
}`;

    const tablesSummary = tables.map(t => ({ id: t.id, name: t.name, capacity: t.capacity, shape: t.shape, notes: t.notes }));
    const guestsSummary = attendingGuests.map(g => ({ id: g.id, name: g.name, group: g.group, plusOne: g.plusOne, dietary: g.dietary }));

    const userPrompt = `Event: "${event.name}" (${event.type || "event"}).
Tables: ${JSON.stringify(tablesSummary)}
Attending Guests: ${JSON.stringify(guestsSummary)}`;

    try {
      const res = await this.callGemini(systemPrompt, userPrompt);
      if (res && res.assignments && typeof res.assignments === "object") {
        return res;
      }
    } catch (e) {
      // Fallback to intelligent local algorithm
    }

    // Intelligent Offline Seating Algorithm
    const assignments = {};
    const tableCapacities = {};
    tables.forEach(t => { tableCapacities[t.id] = t.capacity || 8; });
    const currentTableOccupancy = {};
    tables.forEach(t => { currentTableOccupancy[t.id] = 0; });

    // Group guests by group affinity (e.g. Bridal Party, Family, Friends)
    const grouped = {};
    attendingGuests.forEach(g => {
      const grp = g.group || "General";
      if (!grouped[grp]) grouped[grp] = [];
      grouped[grp].push(g);
    });

    // Sort tables by capacity descending
    const sortedTables = [...tables].sort((a, b) => (b.capacity || 8) - (a.capacity || 8));

    // Distribute groups across tables
    let currentTableIdx = 0;
    Object.keys(grouped).forEach(grpKey => {
      const guestList = grouped[grpKey];
      guestList.forEach(guest => {
        const headcount = 1 + (guest.plusOne ? 1 : 0);
        let assigned = false;

        // Try current table
        for (let i = 0; i < sortedTables.length; i++) {
          const table = sortedTables[(currentTableIdx + i) % sortedTables.length];
          const cap = tableCapacities[table.id];
          const currentOcc = currentTableOccupancy[table.id];
          if (currentOcc + headcount <= cap) {
            assignments[guest.id] = table.id;
            currentTableOccupancy[table.id] += headcount;
            assigned = true;
            break;
          }
        }

        // If all tables at capacity, assign to least full table anyway
        if (!assigned && sortedTables.length > 0) {
          const leastFull = [...sortedTables].sort((a, b) => (currentTableOccupancy[a.id] || 0) - (currentTableOccupancy[b.id] || 0))[0];
          assignments[guest.id] = leastFull.id;
          currentTableOccupancy[leastFull.id] += headcount;
        }
      });
      currentTableIdx = (currentTableIdx + 1) % sortedTables.length;
    });

    // Compile catering notes and rationale
    const cateringNotes = [];
    const dietaryGuests = attendingGuests.filter(g => g.dietary && g.dietary !== "None");
    dietaryGuests.forEach(g => {
      const tblId = assignments[g.id];
      const tbl = tables.find(t => t.id === tblId);
      if (tbl) {
        cateringNotes.push(`${g.name} (${g.dietary}) seated at ${tbl.name}. Ensure kitchen delivers dedicated meal plate.`);
      }
    });

    const rationale = tables.map(tbl => {
      const seatedHere = attendingGuests.filter(g => assignments[g.id] === tbl.id);
      const groupsHere = Array.from(new Set(seatedHere.map(g => g.group || "Guests")));
      return `${tbl.name}: Harmonized ${seatedHere.length} guests (${groupsHere.join(", ") || "General"}) based on social affinities.`;
    });

    const vibeTips = [
      "Keep high-energy friend groups near the dance floor and speakers so elders enjoy easier conversation.",
      "Ensure servers have direct line-of-sight to tables with designated dietary requirements.",
      "Keep 1-2 spare seats unassigned for unexpected plus-ones or last-minute VIP shifts."
    ];

    return {
      assignments,
      rationale,
      cateringNotes: cateringNotes.length > 0 ? cateringNotes : ["All confirmed guests have standard meal selections."],
      vibeTips
    };
  }
};

window.DashboardView = function DashboardView({
  event,
  onNavigateTab,
  onOpenEditEvent,
  darkMode
}) {
  const [aiInsight, setAiInsight] = React.useState(null);
  const [loadingAi, setLoadingAi] = React.useState(false);

  // Calculate metrics
  const targetBudget = Number(event.targetBudget) || 0;
  const totalActual = (event.budgetItems || []).reduce((acc, b) => acc + (Number(b.actual) || 0), 0);
  const totalEst = (event.budgetItems || []).reduce((acc, b) => acc + (Number(b.estimated) || 0), 0);
  const budgetSpentPct = targetBudget > 0 ? Math.min(100, Math.round((totalActual / targetBudget) * 100)) : 0;
  const remainingBudget = targetBudget - totalActual;

  const milestones = (event.timelineItems || []).filter(t => t.type === "milestone");
  const completedMilestones = milestones.filter(t => t.completed).length;
  const milestonePct = milestones.length > 0 ? Math.round((completedMilestones / milestones.length) * 100) : 0;

  const dayOfItems = (event.timelineItems || []).filter(t => t.type === "dayof");

  const totalVendors = (event.vendors || []).length;
  const hiredVendors = (event.vendors || []).filter(v => v.status === "Hired").length;

  const guests = event.guests || [];
  const confirmedGuests = guests.filter(g => g.status === "Attending");
  const confirmedHeadcount = confirmedGuests.reduce((acc, g) => acc + 1 + (g.plusOne ? 1 : 0), 0);
  const tables = event.tables || [];
  const seatedGuestsCount = confirmedGuests.filter(g => g.tableId && tables.some(t => t.id === g.tableId)).length;
  const seatingPct = confirmedGuests.length > 0 ? Math.round((seatedGuestsCount / confirmedGuests.length) * 100) : 0;

  // Days countdown calculation
  const calculateDaysLeft = () => {
    if (!event.date) return 0;
    const target = new Date(event.date);
    const today = new Date();
    target.setHours(0, 0, 0, 0);
    today.setHours(0, 0, 0, 0);
    const diffTime = target - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    return diffDays;
  };

  const daysLeft = calculateDaysLeft();

  const handleFetchAiInsights = async () => {
    setLoadingAi(true);
    try {
      const advice = await window.GeminiService.getBudgetAdvice(event);
      setAiInsight(advice);

      console.error(e);

window.BudgetView = function BudgetView({
  event,
  onUpdateEvent,
  darkMode
}) {
  const [selectedCategory, setSelectedCategory] = React.useState("All");
  const [selectedStatus, setSelectedStatus] = React.useState("All");
  const [isAddModalOpen, setIsAddModalOpen] = React.useState(false);
  const [editingItem, setEditingItem] = React.useState(null);
  const [isAiAdvisorOpen, setIsAiAdvisorOpen] = React.useState(false);
  const [aiAdvice, setAiAdvice] = React.useState(null);
  const [loadingAi, setLoadingAi] = React.useState(false);

  // Form state
  const [formCategory, setFormCategory] = React.useState("Venue");
  const [formTitle, setFormTitle] = React.useState("");
  const [formEstimated, setFormEstimated] = React.useState("");
  const [formActual, setFormActual] = React.useState("");
  const [formPaid, setFormPaid] = React.useState("Unpaid");
  const [formVendor, setFormVendor] = React.useState("");

  const budgetItems = event.budgetItems || [];
  const targetBudget = Number(event.targetBudget) || 0;
  const currency = event.currency || "$";

  // Calculations
  const totalEstimated = budgetItems.reduce((acc, i) => acc + (Number(i.estimated) || 0), 0);
  const totalActual = budgetItems.reduce((acc, i) => acc + (Number(i.actual) || 0), 0);
  const variance = targetBudget - totalActual;
  const pctSpent = targetBudget > 0 ? Math.min(100, Math.round((totalActual / targetBudget) * 100)) : 0;

  // Unique categories
  const categories = ["All", ...Array.from(new Set(budgetItems.map(i => i.category || "General")))];

  // Filtered items
  const filteredItems = budgetItems.filter(item => {
    const matchCat = selectedCategory === "All" || item.category === selectedCategory;
    const matchStatus = selectedStatus === "All" || item.paid === selectedStatus;
    return matchCat && matchStatus;
  });

  const openAddModal = () => {
    setEditingItem(null);
    setFormCategory("Venue");
    setFormTitle("");
    setFormEstimated("");
    setFormActual("");
    setFormPaid("Unpaid");
    setFormVendor("");
    setIsAddModalOpen(true);
  };

  const openEditModal = (item) => {
    setEditingItem(item);
    setFormCategory(item.category);
    setFormTitle(item.title);
    setFormEstimated(item.estimated);
    setFormActual(item.actual);
    setFormPaid(item.paid);
    setFormVendor(item.vendor || "");
    setIsAddModalOpen(true);
  };

  const handleSaveItem = (e) => {
    e.preventDefault();
    if (!formTitle.trim()) return;

    let updatedItems;
    if (editingItem) {
      updatedItems = budgetItems.map(item =>
        item.id === editingItem.id
          ? {
              ...item,
              category: formCategory,
              title: formTitle.trim(),
              estimated: Number(formEstimated) || 0,
              actual: Number(formActual) || 0,
              paid: formPaid,
              vendor: formVendor.trim()
            }
          : item
      );
    } else {
      const newItem = {
        id: `b-${Date.now()}`,
        category: formCategory,
        title: formTitle.trim(),
        estimated: Number(formEstimated) || 0,
        actual: Number(formActual) || 0,
        paid: formPaid,
        vendor: formVendor.trim()
      };
      updatedItems = [...budgetItems, newItem];
    }

    onUpdateEvent({ ...event, budgetItems: updatedItems });
    setIsAddModalOpen(false);
  };

  const handleDeleteItem = (id) => {
    if (confirm("Are you sure you want to delete this expense item?")) {
      const updatedItems = budgetItems.filter(item => item.id !== id);
      onUpdateEvent({ ...event, budgetItems: updatedItems });
    }
  };

  const handleTogglePaidStatus = (item) => {
    const nextStatus = item.paid === "Unpaid" ? "Deposit Paid" : item.paid === "Deposit Paid" ? "Paid in Full" : "Unpaid";
    const updatedItems = budgetItems.map(i => i.id === item.id ? { ...i, paid: nextStatus } : i);
    onUpdateEvent({ ...event, budgetItems: updatedItems });
  };

  const handleOpenAiAdvisor = async () => {
    setIsAiAdvisorOpen(true);
    if (!aiAdvice) {
      setLoadingAi(true);
      try {
        const advice = await window.GeminiService.getBudgetAdvice(event);
        setAiAdvice(advice);
      } catch (err) {
        console.error(err);
      } finally {
        setLoadingAi(false);
      }
    }
  };

  // Group by category for visual distribution
  const categoryStats = React.useMemo(() => {
    const map = {};
    budgetItems.forEach(i => {
      const cat = i.category || "Other";
      if (!map[cat]) map[cat] = { est: 0, act: 0 };
      map[cat].est += Number(i.estimated) || 0;
      map[cat].act += Number(i.actual) || 0;
    });
    return Object.entries(map).map(([category, stats]) => ({
      category,
      ...stats,
      pctOfTarget: targetBudget > 0 ? Math.round((stats.est / targetBudget) * 100) : 0
    }));
  }, [budgetItems, targetBudget]);

      ),
      React.createElement(
        "div",
        { className: "flex items-center gap-3" },
        React.createElement(
          "button",
          {

            className: "flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-amber-500 to-purple-600 text-white shadow-md active:scale-95 transition-all"
          },
          React.createElement(window.Icons.Sparkles, { className: "w-4 h-4" }),
          "AI Budget Advisor"
        ),
        React.createElement(

          {

          },

          "Add Expense"
        )
      )
    ),

    // 4 High-level Financial Metrics
    React.createElement(
      "div",
      { className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" },

        { className: "p-5 rounded-2xl glass-panel glass-panel-hover" },

// Timeline & Run-of-Show Component

window.TimelineView = function TimelineView({
  event,
  onUpdateEvent,
  darkMode
}) {
  const [subView, setSubView] = React.useState("milestones"); // 'milestones' or 'dayof'
  const [filterStatus, setFilterStatus] = React.useState("All"); // 'All', 'Pending', 'Completed'
  const [isAddModalOpen, setIsAddModalOpen] = React.useState(false);
  const [editingItem, setEditingItem] = React.useState(null);

  // Form states
  const [formTitle, setFormTitle] = React.useState("");
  const [formCategory, setFormCategory] = React.useState("General");
  const [formDeadline, setFormDeadline] = React.useState("");
  const [formTime, setFormTime] = React.useState("12:00 PM");
  const [formLead, setFormLead] = React.useState("");
  const [formNotes, setFormNotes] = React.useState("");

  const timelineItems = event.timelineItems || [];
  const milestones = timelineItems.filter(i => i.type === "milestone");
  const dayOfItems = timelineItems.filter(i => i.type === "dayof");

  // Sorted items
  const sortedMilestones = [...milestones].sort((a, b) => new Date(a.deadline || "2099-01-01") - new Date(b.deadline || "2099-01-01"));
  const sortedDayOf = [...dayOfItems];

  const filteredMilestones = sortedMilestones.filter(m => {
    if (filterStatus === "Pending") return !m.completed;
    if (filterStatus === "Completed") return m.completed;
    return true;
  });

  const completedMilestones = milestones.filter(m => m.completed).length;
  const progressPct = milestones.length > 0 ? Math.round((completedMilestones / milestones.length) * 100) : 0;

  const handleToggleMilestone = (item) => {
    const updated = timelineItems.map(i => {
      if (i.id === item.id) {
        const nextState = !i.completed;
        // If completing and all done, shoot confetti!
        if (nextState && window.confetti && completedMilestones + 1 === milestones.length) {
          window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
        return { ...i, completed: nextState };
      }
      return i;
    });
    onUpdateEvent({ ...event, timelineItems: updated });
  };

  const openAddModal = () => {
    setEditingItem(null);
    setFormTitle("");
    setFormCategory("General");
    setFormDeadline(event.date || "");
    setFormTime("10:00 AM");
    setFormLead("");
    setFormNotes("");
    setIsAddModalOpen(true);
  };

  const openEditModal = (item) => {
    setEditingItem(item);
    setFormTitle(item.title);
    setFormCategory(item.category || "General");
    setFormDeadline(item.deadline || "");
    setFormTime(item.time || "10:00 AM");
    setFormLead(item.lead || "");
    setFormNotes(item.notes || "");
    setIsAddModalOpen(true);
  };

  const handleSaveItem = (e) => {
    e.preventDefault();
    if (!formTitle.trim()) return;

    let updatedItems;
    if (editingItem) {
      updatedItems = timelineItems.map(item =>
        item.id === editingItem.id
          ? {
              ...item,
              title: formTitle.trim(),
              category: formCategory.trim(),
              deadline: subView === "milestones" ? formDeadline : undefined,
              time: subView === "dayof" ? formTime : undefined,
              lead: subView === "dayof" ? formLead.trim() : undefined,
              notes: subView === "dayof" ? formNotes.trim() : undefined
            }
          : item
      );
    } else {
      const newItem = {
        id: `t-${Date.now()}`,
        type: subView === "milestones" ? "milestone" : "dayof",
        title: formTitle.trim(),
        category: formCategory.trim(),
        completed: false,
        deadline: subView === "milestones" ? formDeadline : undefined,
        time: subView === "dayof" ? formTime : undefined,
        lead: subView === "dayof" ? formLead.trim() : undefined,
        notes: subView === "dayof" ? formNotes.trim() : undefined
      };
      updatedItems = [...timelineItems, newItem];
    }

    onUpdateEvent({ ...event, timelineItems: updatedItems });
    setIsAddModalOpen(false);
  };

  const handleDeleteItem = (id) => {
    if (confirm("Delete this timeline entry?")) {
      const updated = timelineItems.filter(i => i.id !== id);
      onUpdateEvent({ ...event, timelineItems: updated });
    }
  };

  return React.createElement(
    "div",
    { className: "space-y-6" },

    // Header Controls & View Switcher
    React.createElement(
      "div",
      { className: "flex flex-col sm:flex-row sm:items-center justify-between gap-4" },
      React.createElement(
        "div",
        null,
        React.createElement("h2", { className: "text-2xl font-black text-gradient" }, "Timeline & Master Schedule"),
        React.createElement("p", { className: "text-xs text-slate-400" }, "Track countdown preparation milestones and manage the day-of run-of-show")
      ),
      React.createElement(
        "div",
        { className: "flex items-center gap-3" },
        // View Toggle Pills
        React.createElement(
          "div",
          { className: `p-1 rounded-xl border flex items-center gap-1 ${darkMode ? "bg-slate-900 border-slate-700" : "bg-slate-100 border-slate-200"}` },
          React.createElement(
            "button",
            {
              onClick: () => setSubView("milestones"),
              className: `px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                subView === "milestones"
                  ? "bg-purple-600 text-white shadow-sm"
                  : "text-slate-400 hover:text-slate-200"
              }`
            },
            `Milestones (${milestones.length})`
          ),
          React.createElement(
            "button",
            {
              onClick: () => setSubView("dayof"),
              className: `px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                subView === "dayof"
                  ? "bg-pink-600 text-white shadow-sm"
                  : "text-slate-400 hover:text-slate-200"
              }`
            },
            `Day-of Run of Show (${dayOfItems.length})`
          )
        ),
        React.createElement(
          "button",
          {
            onClick: openAddModal,
            className: "flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold bg-purple-600 hover:bg-purple-500 text-white shadow-md active:scale-95 transition-all"
          },
          React.createElement(window.Icons.Plus, { className: "w-4 h-4" }),
          subView === "milestones" ? "Add Milestone" : "Add Itinerary Step"
        )
      )
    ),

    // Subview 1: Milestones
    subView === "milestones" ? React.createElement(
      "div",
      { className: "space-y-4" },

      // Progress Banner
      React.createElement(
        "div",
        { className: "p-6 rounded-3xl glass-panel shadow-lg" },
        React.createElement(
          "div",
          { className: "flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3" },
          React.createElement(
            "div",
            null,
            React.createElement("div", { className: "text-xs font-semibold text-slate-400 uppercase tracking-wider" }, "Readiness Score"),
            React.createElement("div", { className: "text-xl font-bold text-slate-100" }, `${completedMilestones} of ${milestones.length} Milestones Accomplished`)
          ),
          // Filter pills
          React.createElement(
            "div",
            { className: "flex items-center gap-2" },
            ["All", "Pending", "Completed"].map(st =>
              React.createElement(
                "button",
                {
                  key: st,
                  onClick: () => setFilterStatus(st),
                  className: `px-3 py-1 rounded-xl text-xs font-semibold transition-all ${
                    filterStatus === st ? "bg-purple-600/30 text-purple-300 font-bold border border-purple-500/40 shadow-sm" : "glass-pill text-slate-300 hover:text-white"
                  }`
                },

              )
            )
          )
        ),
        React.createElement(
          "div",
          { className: "w-full h-2.5 rounded-full bg-white/10 overflow-hidden" },

            style: { width: `${progressPct}%` }
          })
        )
      ),

      // Milestones List
      React.createElement(
        "div",
        { className: "space-y-3" },
        filteredMilestones.length === 0 ? React.createElement(

  const [formPhone, setFormPhone] = React.useState("");

  const guests = event.guests || [];
  const tables = event.tables || [];

  const totalGuests = guests.length;
  const attendingGuests = guests.filter(g => g.status === "Attending");
  const totalAttendingHeadcount = attendingGuests.reduce((acc, g) => acc + 1 + (g.plusOne ? 1 : 0), 0);
  const pendingGuests = guests.filter(g => g.status === "Pending");

    const counts = {};

// Interactive Table & Seating Chart Planner Component (Crystal Glass UI)

window.SeatingView = function SeatingView({
  event,
  onUpdateEvent,
  darkMode,
  onNavigateTab
}) {
  const [shapeFilter, setShapeFilter] = React.useState("All");
  const [searchQuery, setSearchQuery] = React.useState("");
  const [isAddTableModalOpen, setIsAddTableModalOpen] = React.useState(false);
  const [editingTable, setEditingTable] = React.useState(null);

  // Form states for Add/Edit Table
  const [formName, setFormName] = React.useState("");
  const [formCapacity, setFormCapacity] = React.useState(8);
  const [formShape, setFormShape] = React.useState("round");
  const [formNotes, setFormNotes] = React.useState("");

  // AI Seating Strategist Modal state
  const [isAiModalOpen, setIsAiModalOpen] = React.useState(false);
  const [aiLoading, setAiLoading] = React.useState(false);
  const [aiResult, setAiResult] = React.useState(null);

  // Printable Catering & Seating Sheet Modal
  const [isPrintModalOpen, setIsPrintModalOpen] = React.useState(false);
  const [copiedPrint, setCopiedPrint] = React.useState(false);

  // Unassigned Drawer search
  const [unassignedSearch, setUnassignedSearch] = React.useState("");

  const tables = event.tables || [];
  const guests = event.guests || [];
  const attendingGuests = guests.filter(g => g.status === "Attending");

  // Calculations
  const totalCapacity = tables.reduce((acc, t) => acc + (parseInt(t.capacity) || 0), 0);
  
  // Calculate seated headcount taking plus-ones into account
  const seatedGuests = attendingGuests.filter(g => g.tableId && tables.some(t => t.id === g.tableId));
  const seatedHeadcount = seatedGuests.reduce((acc, g) => acc + 1 + (g.plusOne ? 1 : 0), 0);
  
  const unassignedGuests = attendingGuests.filter(g => !g.tableId || !tables.some(t => t.id === g.tableId));
  const unassignedHeadcount = unassignedGuests.reduce((acc, g) => acc + 1 + (g.plusOne ? 1 : 0), 0);

  const totalAttendingHeadcount = attendingGuests.reduce((acc, g) => acc + 1 + (g.plusOne ? 1 : 0), 0);
  const seatingPercentage = totalAttendingHeadcount > 0 ? Math.min(100, Math.round((seatedHeadcount / totalAttendingHeadcount) * 100)) : 0;

  // Dietary Alerts
  const dietaryAlertCount = attendingGuests.filter(g => g.dietary && g.dietary !== "None").length;

  // Filtered tables
  const filteredTables = tables.filter(t => {
    const matchesShape = shapeFilter === "All" || t.shape === shapeFilter;
    const matchesSearch = !searchQuery || 
      t.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
      (t.notes && t.notes.toLowerCase().includes(searchQuery.toLowerCase())) ||
      seatedGuests.some(g => g.tableId === t.id && g.name.toLowerCase().includes(searchQuery.toLowerCase()));
    return matchesShape && matchesSearch;
  });

  // Table Modal handlers
  const openAddTableModal = () => {
    setEditingTable(null);
    setFormName(`Table ${tables.length + 1}`);
    setFormCapacity(8);
    setFormShape("round");
    setFormNotes("");
    setIsAddTableModalOpen(true);
  };

  const openEditTableModal = (table) => {
    setEditingTable(table);
    setFormName(table.name);
    setFormCapacity(table.capacity || 8);
    setFormShape(table.shape || "round");
    setFormNotes(table.notes || "");
    setIsAddTableModalOpen(true);
  };

  const handleSaveTable = (e) => {
    e.preventDefault();
    if (!formName.trim()) return;

    let updatedTables;
    if (editingTable) {
      updatedTables = tables.map(t =>
        t.id === editingTable.id
          ? { ...t, name: formName.trim(), capacity: parseInt(formCapacity) || 8, shape: formShape, notes: formNotes.trim() }
          : t
      );
    } else {
      const newTable = {
        id: `tbl-${Date.now()}`,
        name: formName.trim(),
        capacity: parseInt(formCapacity) || 8,
        shape: formShape,
        notes: formNotes.trim()
      };
      updatedTables = [...tables, newTable];
    }

    onUpdateEvent({ ...event, tables: updatedTables });
    setIsAddTableModalOpen(false);
  };

  const handleDeleteTable = (tableId) => {
    if (!confirm("Are you sure you want to delete this table? Guests assigned to it will be unseated.")) return;
    const updatedTables = tables.filter(t => t.id !== tableId);
    // Unassign guests
    const updatedGuests = guests.map(g => g.tableId === tableId ? { ...g, tableId: null } : g);
    onUpdateEvent({ ...event, tables: updatedTables, guests: updatedGuests });
  };

  const handleClearTable = (tableId) => {
    const updatedGuests = guests.map(g => g.tableId === tableId ? { ...g, tableId: null } : g);
    onUpdateEvent({ ...event, guests: updatedGuests });
  };

  // Seat / Unseat guest
  const handleAssignGuestToTable = (guestId, tableId) => {
    const updatedGuests = guests.map(g => g.id === guestId ? { ...g, tableId: tableId || null } : g);
    onUpdateEvent({ ...event, guests: updatedGuests });
  };

  // Quick Auto-Seat Remaining
  const handleAutoSeatRemaining = () => {
    if (tables.length === 0 || unassignedGuests.length === 0) return;

    // Track table occupancy
    const tableOccupancy = {};
    tables.forEach(t => {
      const seatedHere = seatedGuests.filter(g => g.tableId === t.id);
      tableOccupancy[t.id] = seatedHere.reduce((sum, g) => sum + 1 + (g.plusOne ? 1 : 0), 0);
    });

    const updatedGuests = [...guests];
    unassignedGuests.forEach(guest => {
      const headcount = 1 + (guest.plusOne ? 1 : 0);
      // Find table with available room
      const availableTable = tables.find(t => (tableOccupancy[t.id] + headcount) <= (t.capacity || 8));
      if (availableTable) {
        const idx = updatedGuests.findIndex(g => g.id === guest.id);
        if (idx !== -1) {
          updatedGuests[idx] = { ...updatedGuests[idx], tableId: availableTable.id };
          tableOccupancy[availableTable.id] += headcount;
        }
      }
    });

    onUpdateEvent({ ...event, guests: updatedGuests });
    if (window.confetti) {
      window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
    }
  };

  // Run AI Seating Strategist
  const handleRunAiSeating = async () => {
    setIsAiModalOpen(true);
    setAiLoading(true);
    try {
      const result = await window.GeminiService.generateSeatingArrangement(event, tables, guests);
      setAiResult(result);
    } catch (e) {
      console.error("AI Seating Error", e);
    } finally {
      setAiLoading(false);
    }
  };

  // Apply AI Seating Plan
  const handleApplyAiSeating = () => {
    if (!aiResult || !aiResult.assignments) return;
    const assignments = aiResult.assignments;
    const updatedGuests = guests.map(g => {
      if (assignments[g.id]) {
        return { ...g, tableId: assignments[g.id] };
      }
      return g;
    });

    onUpdateEvent({ ...event, guests: updatedGuests });
    setIsAiModalOpen(false);

    if (window.confetti) {
      window.confetti({
        particleCount: 100,
        spread: 80,
        origin: { y: 0.6 }
      });
    }
  };

  // Helper for shape icon and badge
  const getShapeDetails = (shape) => {
    switch (shape) {
      case "sweetheart": return { label: "Sweetheart", icon: "💖", desc: "2 Seats" };
      case "rectangular": return { label: "Rectangular", icon: "▭", desc: "Long Table" };
      case "high-top": return { label: "High-Top", icon: "🍸", desc: "Cocktail Style" };
      case "booth": return { label: "Lounge Booth", icon: "🛋️", desc: "Cozy Seating" };
      case "round":
      default: return { label: "Round Table", icon: "⭕", desc: "Standard Banquet" };
    }
  };

  // Helper for dietary alert styling
  const getDietaryBadge = (diet) => {
    if (!diet || diet === "None") return null;
    let icon = "🥗";
    if (diet.toLowerCase().includes("nut") || diet.toLowerCase().includes("peanut")) icon = "⚠️";
    else if (diet.toLowerCase().includes("gluten")) icon = "🌾";
    else if (diet.toLowerCase().includes("vegan")) icon = "🌱";
    else if (diet.toLowerCase().includes("veg")) icon = "🥦";
    else if (diet.toLowerCase().includes("halal") || diet.toLowerCase().includes("kosher")) icon = "✨";

    return React.createElement(
      "span",
      { className: "px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-500/15 text-amber-300 border border-amber-500/30 flex items-center gap-1" },

// Root App Component for PlanPulse

function App() {
  const [events, setEvents] = React.useState([]);
  const [activeEventId, setActiveEventId] = React.useState("");
  const [activeTab, setActiveTab] = React.useState("dashboard"); // dashboard, budget, timeline, vendors, ideas
  const [darkMode, setDarkMode] = React.useState(true);
  const [hasApiKey, setHasApiKey] = React.useState(false);

  // Modals
  const [isOneClickModalOpen, setIsOneClickModalOpen] = React.useState(false);
  const [isEventModalOpen, setIsEventModalOpen] = React.useState(false);
  const [isEditEventModalOpen, setIsEditEventModalOpen] = React.useState(false);
  const [isAIConfigOpen, setIsAIConfigOpen] = React.useState(false);

  // Initialize data on mount
  React.useEffect(() => {
    const loadedEvents = window.StorageService.getEvents();
    const activeId = window.StorageService.getActiveEventId();
    const isDark = window.StorageService.getDarkMode();
    const key = window.StorageService.getApiKey();

    setEvents(loadedEvents);
    setActiveEventId(activeId && loadedEvents.some(e => e.id === activeId) ? activeId : (loadedEvents[0]?.id || ""));
    setDarkMode(isDark);
    setHasApiKey(!!key);
  }, []);

  // Update theme class on HTML element
  React.useEffect(() => {
    if (darkMode) {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }
    window.StorageService.setDarkMode(darkMode);
  }, [darkMode]);

  const activeEvent = events.find(e => e.id === activeEventId) || events[0] || null;

  const handleSelectEvent = (id) => {
    setActiveEventId(id);
    window.StorageService.setActiveEventId(id);
  };

  const handleUpdateActiveEvent = (updated) => {
    const updatedEvents = events.map(e => e.id === updated.id ? updated : e);
    setEvents(updatedEvents);
    window.StorageService.saveEvents(updatedEvents);
  };

  const handleCreateNewEvent = (newEvent) => {
    const updatedEvents = [newEvent, ...events];
    setEvents(updatedEvents);
    setActiveEventId(newEvent.id);
    window.StorageService.saveEvents(updatedEvents);
    window.StorageService.setActiveEventId(newEvent.id);
    setActiveTab("dashboard");
  };

  const handleToggleDarkMode = () => {
    setDarkMode(prev => !prev);
  };

  const handleAISaved = () => {
    setHasApiKey(!!window.StorageService.getApiKey());
  };

  const tabs = [
    { id: "dashboard", label: "Dashboard", icon: window.Icons.TrendingUp },
    { id: "budget", label: "Budget & Costs", icon: window.Icons.DollarSign, count: activeEvent?.budgetItems?.length },
    { id: "timeline", label: "Timeline & Schedule", icon: window.Icons.Clock, count: activeEvent?.timelineItems?.length },
    { id: "guests", label: "Guest List & RSVP", icon: window.Icons.Users, count: activeEvent?.guests?.length || 0 },
    { id: "seating", label: "Seating Chart", icon: window.Icons.LayoutGrid, count: activeEvent?.tables?.length || 0 },
    { id: "vendors", label: "Vendor Directory", icon: window.Icons.Building2, count: activeEvent?.vendors?.length },
    { id: "ideas", label: "GenAI Idea Studio", icon: window.Icons.Lightbulb, count: activeEvent?.ideas?.length }
  ];

  if (!activeEvent) {
    return React.createElement(
      "div",
      { className: "min-h-screen flex items-center justify-center p-4 bg-slate-950 text-white" },
      React.createElement("div", { className: "text-center space-y-4" },
        React.createElement(window.Icons.Sparkles, { className: "w-10 h-10 text-purple-400 mx-auto animate-spin" }),
        React.createElement("h2", { className: "text-xl font-bold" }, "Loading PlanPulse Event Assistant...")
      )
    );
  }

  return React.createElement(
    "div",
    {
      className: `min-h-screen flex flex-col transition-colors duration-200 bg-transparent ${
        darkMode ? "text-slate-100" : "text-slate-900"
      }`
    },

    // Top Navigation
    React.createElement(window.Navbar, {
      events,
      activeEvent,
      onSelectEvent: handleSelectEvent,
      onOpenNewEvent: () => setIsEventModalOpen(true),
      onOpenAIConfig: () => setIsAIConfigOpen(true),
      onOpenOneClickPlan: () => setIsOneClickModalOpen(true),
      darkMode,
      onToggleDarkMode: handleToggleDarkMode,
      hasApiKey
    }),

    React.createElement(
      "main",
      { className: "flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6" },

        },

                  : "text-slate-400 hover:text-white hover:bg-white/10"

            React.createElement(tab.icon, { className: "w-4 h-4 text-white" }),
            React.createElement("span", null, tab.label),
            tab.count !== undefined && React.createElement(
              "span",
              {
                className: `text-[10px] font-extrabold px-1.5 py-0.5 rounded-full ${

      }),
